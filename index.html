      background-color: #041612;
      margin: 0;
      padding: 0;
      overflow-x: hidden;

    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes floatUpSlow {
      0% {
        transform: translateY(100%) translateX(0px) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.75;
      }
      80% {
        opacity: 0.75;
      }
      100% {
        transform: translateY(-120px) translateX(25px) scale(1.15);
        opacity: 0;
      }
    }

    @keyframes burstPetal {
      0% {
        transform: translate(0, 0) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot));
        opacity: 0;
      }
    }

    @keyframes sealPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(229, 193, 88, 0.6), 0 12px 30px rgba(0, 0, 0, 0.75);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 16px rgba(229, 193, 88, 0), 0 16px 38px rgba(229, 193, 88, 0.45);
        transform: scale(1.05);
      }
    }

    @keyframes stageReveal {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .firefly-particle {
      animation: floatUpSlow linear infinite;
    }
    .wax-seal-glow {
      animation: sealPulse 2.4s infinite ease-in-out;
    }
    .stage-transition {
      animation: stageReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .petal-burst-item {
      animation: burstPetal 1.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .gold-shimmer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 248, 220, 0.38), transparent);
      animation: shimmerSweep 3.2s infinite;
    }
  </style>

      ta.value = text;

    // ============================================================================
    // PERSISTENT MUSIC SYNTH + MP3 PLAYER (Supports Auto-Start on Seal Break)
    // ============================================================================
    const RoyalSoundController = ({ isPlaying, onTogglePlay, customAudioUrl }) => {
      const [isMuted, setIsMuted] = useState(false);
      const audioElRef = useRef(null);
      const audioCtxRef = useRef(null);
      const synthTimerRef = useRef(null);
      const gainRef = useRef(null);
      const [mp3Failed, setMp3Failed] = useState(false);

      const stopSynth = useCallback(() => {
        if (synthTimerRef.current) {
          clearInterval(synthTimerRef.current);
          synthTimerRef.current = null;
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'running') {
          audioCtxRef.current.suspend().catch(() => {});
        }
      }, []);

      const startSynth = useCallback(() => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!audioCtxRef.current) {
            const ctx = new AudioCtx();
            const master = ctx.createGain();
            master.gain.value = isMuted ? 0 : 0.14;
            master.connect(ctx.destination);
            audioCtxRef.current = ctx;
            gainRef.current = master;
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();
          if (synthTimerRef.current) clearInterval(synthTimerRef.current);

          // Royal Yaman / Evening Raga pentatonic notes
          const notes = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33];
          let step = 0;

          const playPluck = () => {
            if (!audioCtxRef.current || audioCtxRef.current.state !== 'running') return;
            const now = ctx.currentTime;
            const freq = notes[(step * 2 + (step % 3)) % notes.length];
            const osc = ctx.createOscillator();
            const noteGain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            noteGain.gain.setValueAtTime(0.001, now);
            noteGain.gain.linearRampToValueAtTime(0.28, now + 0.05);
            noteGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
            osc.connect(noteGain);
            noteGain.connect(gainRef.current);
            osc.start(now);
            osc.stop(now + 1.55);
            step++;
          };

          playPluck();
          synthTimerRef.current = setInterval(playPluck, 880);
        } catch (err) {}
      }, [isMuted]);

      useEffect(() => {
        if (!isPlaying) {
          if (audioElRef.current) audioElRef.current.pause();
          stopSynth();
          return;
        }

        if (customAudioUrl && !mp3Failed && audioElRef.current) {
          audioElRef.current
            .play()
            .catch(() => {
              setMp3Failed(true);
              startSynth();
            });
        } else {
          startSynth();
        }

        return () => stopSynth();
      }, [isPlaying, customAudioUrl, mp3Failed, startSynth, stopSynth]);

      useEffect(() => {
        if (audioElRef.current) audioElRef.current.muted = isMuted;
        if (gainRef.current && audioCtxRef.current) {
          gainRef.current.gain.setValueAtTime(isMuted ? 0 : 0.14, audioCtxRef.current.currentTime);
        }
      }, [isMuted]);

      return (
        <div className="flex items-center gap-1.5">
          {customAudioUrl && (
            <audio
              ref={audioElRef}
              src={customAudioUrl}
              loop
              onError={() => setMp3Failed(true)}
            />
          )}
          <button
            onClick={onTogglePlay}
            className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#07261F]/90 border border-[#E5C158]/60 text-[#FFFDF9] hover:border-[#E5C158] transition shadow-lg"
            title={isPlaying ? 'Pause Royal Music' : 'Play Royal Music'}
          >
            <span
              className={`w-5 h-5 rounded-full bg-gradient-to-tr from-[#B38728] to-[#FBF5B7] text-[#041612] flex items-center justify-center ${
                isPlaying ? 'animate-spin' : ''
              }`}
              style={{ animationDuration: '5s' }}
            >
              {isPlaying ? <PauseIcon className="w-3 h-3" /> : <PlayIcon className="w-3 h-3 ml-0.5" />}
            </span>
            <span className="text-[10px] uppercase tracking-[0.18em] text-[#E5C158] font-semibold">
              {isPlaying ? 'Sound On' : 'Music'}
            </span>
          </button>
          {isPlaying && (
            <button
              onClick={() => setIsMuted((m) => !m)}
              className="p-1.5 rounded-full bg-[#07261F]/90 border border-[#E5C158]/40 text-[#E5C158]"
              aria-label="Mute or Unmute"
            >
              {isMuted ? <VolumeXIcon className="w-3.5 h-3.5" /> : <Volume2Icon className="w-3.5 h-3.5" />}
            </button>
          )}
        </div>
      );
    };

      const [icsSaved, setIcsSaved] = useState(false);
      const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, completed: false });

      useEffect(() => {
        const target = new Date(config.weddingDateISO).getTime();
        const tick = () => {
          const diff = target - Date.now();
          if (isNaN(target) || diff <= 0) {
            setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0, completed: true });
            return;
          }
          setTimeLeft({
            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
            minutes: Math.floor((diff / 1000 / 60) % 60),
            seconds: Math.floor((diff / 1000) % 60),
            completed: false
          });
        };
        tick();
        const timer = setInterval(tick, 1000);
        return () => clearInterval(timer);
      }, [config.weddingDateISO]);

      const handleScratchMove = () => {
        if (isRevealed) return;
        setScratchProgress((prev) => {
          const next = prev + 18;
          if (next >= 100) {
            setIsRevealed(true);
            onTriggerBurst();
            return 100;
          }
          return next;
        });
      };

      const handleInstantReveal = () => {
        if (!isRevealed) {
          setScratchProgress(100);
          setIsRevealed(true);
          onTriggerBurst();
        }
      };

      const handleDownloadICS = () => {
        const icsLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'BEGIN:VEVENT',
          'DTSTART:20270215T133000Z',
          'DTEND:20270215T183000Z',
          `SUMMARY:Wedding of ${config.couple.brideName} & ${config.couple.groomName}`,
          `DESCRIPTION:${config.couple.invitationMessage}`,
          `LOCATION:${config.venue.name}`,
          'END:VEVENT',
          'END:VCALENDAR'
        ];
        const blob = new Blob([icsLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${config.couple.brideShort}-${config.couple.groomShort}-Wedding.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setIcsSaved(true);
        setTimeout(() => setIcsSaved(false), 3000);
      };

      return (
        <section className="relative w-full h-full flex flex-col justify-between items-center text-center px-6 py-6 sm:px-8 sm:py-7 overflow-y-auto no-scrollbar">

            {/* Interactive Gold Foil Overlay */}

                  Scratch or Tap Gold Foil
                </p>
                <p className="text-[10px] font-semibold uppercase tracking-widest text-[#041612]/80 mt-0.5">
                  To Reveal the Auspicious Muhurtham ({scratchProgress}%)
                </p>
              </div>
            )}
          </div>

          {/* Live Countdown Numerals */}
          <div className="w-full max-w-sm">
            {timeLeft.completed ? (
              <div className="p-3 rounded-2xl bg-[#092E26] border border-[#E5C158] text-[#FDE68A] royal-serif text-lg">

    // ============================================================================
    // FULL-SCREEN LIGHTBOX MODAL
    // ============================================================================
    const LightboxModal = ({ isOpen, items, currentIndex, onClose, onPrev, onNext }) => {
      useEffect(() => {
        if (!isOpen) return;
        const onKey = (e) => {
          if (e.key === 'Escape') onClose();
          if (e.key === 'ArrowLeft' && items.length > 1) onPrev();
          if (e.key === 'ArrowRight' && items.length > 1) onNext();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [isOpen, items.length, onClose, onPrev, onNext]);

      if (!isOpen || !items || items.length === 0) return null;
      const active = items[currentIndex] || items[0];

      return (
        <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col items-center justify-center p-4">

    // ============================================================================
    // MAIN APP ORCHESTRATOR
    // ============================================================================
    function App() {
      const [currentCard, setCurrentCard] = useState(0);
      const [eventStep, setEventStep] = useState(0);
      const [isPlayingMusic, setIsPlayingMusic] = useState(false);
      const [blessingsCount, setBlessingsCount] = useState(108);
      const [bursts, setBursts] = useState([]);
      const [lightbox, setLightbox] = useState({ isOpen: false, items: [], currentIndex: 0 });

      const touchStartX = useRef(null);
      const touchStartY = useRef(null);

      const triggerPetalBurst = useCallback(() => {
        const colors = ['bg-[#F59E0B]', 'bg-[#FDE68A]', 'bg-[#E11D48]', 'bg-[#10B981]'];
        const newParticles = Array.from({ length: 18 }, (_, i) => {
          const angle = (Math.PI * 2 * i) / 18;
          const distance = 90 + Math.random() * 110;
          return {
            id: `${Date.now()}-${i}-${Math.random()}`,
            tx: `${Math.cos(angle) * distance}px`,
            ty: `${Math.sin(angle) * distance - 40}px`,
            rot: `${Math.floor(Math.random() * 360)}deg`,
            color: colors[i % colors.length]
          };
        });
        setBursts((prev) => [...prev, ...newParticles]);
        setTimeout(() => {
          setBursts((prev) => prev.slice(newParticles.length));
        }, 1300);
      }, []);

      const goToCard = useCallback((index) => {
        if (index < 0 || index >= CHAPTERS.length) return;
        if (index === 4) setEventStep(0);
        setCurrentCard(index);
      }, []);

      const nextCard = useCallback(() => {
        // On Card 05 (index 4), reveal each of the 5 festivities one by one before advancing to Card 06
        if (currentCard === 4 && eventStep < WEDDING_CONFIG.events.length - 1) {
          setEventStep((s) => s + 1);
          return;
        }
        if (currentCard < CHAPTERS.length - 1) {
          const nextIdx = currentCard + 1;
          if (nextIdx === 4) setEventStep(0);
          setCurrentCard(nextIdx);
        }
      }, [currentCard, eventStep]);

      const prevCard = useCallback(() => {
        // On Card 05 (index 4), step back through revealed festivities first
        if (currentCard === 4 && eventStep > 0) {
          setEventStep((s) => s - 1);
          return;
        }
        if (currentCard > 0) {
          const prevIdx = currentCard - 1;
          if (prevIdx === 4) setEventStep(WEDDING_CONFIG.events.length - 1);
          setCurrentCard(prevIdx);
        }
      }, [currentCard, eventStep]);

      // Desktop Keyboard Arrow Support
      useEffect(() => {
        const onKey = (e) => {
          if (lightbox.isOpen) return;
          if (e.key === 'ArrowRight') nextCard();
          if (e.key === 'ArrowLeft') prevCard();
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [nextCard, prevCard, lightbox.isOpen]);

      return (
        <div className="relative min-h-screen w-full bg-[#041612] text-[#FFFDF9] flex flex-col items-center justify-center p-2 sm:p-4 overflow-x-hidden">
          {/* Ambient Emerald Palace Radial Spotlight */}
          <div className="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_top,_#0D3B2E_0%,_#041612_72%)]" />

          {/* Top Bar: Progress Pill + Chapter Jump Pills + Music Controller */}
          <header className="relative z-40 w-full max-w-[440px] flex items-center justify-between gap-2 mb-2 px-1">
            <div className="flex items-center gap-2 bg-[#07261F]/90 border border-[#E5C158]/50 rounded-full px-3 py-1 shadow-lg">
              <span className="text-[11px] font-extrabold tracking-[0.2em] text-[#FDE68A]">
                0{currentCard + 1} / 0{CHAPTERS.length}
              </span>
              <span className="text-[10px] uppercase tracking-wider text-[#D1FAE5] hidden xs:inline">
                • {CHAPTERS[currentCard].name}
              </span>
            </div>

            <RoyalSoundController
              isPlaying={isPlayingMusic}
              onTogglePlay={() => setIsPlayingMusic((p) => !p)}
              customAudioUrl={WEDDING_CONFIG.assets.musicUrl}
            />
          </header>

          {/* Main Interactive Stage with Floating Side Arrows */}
          <div className="relative w-full max-w-[440px] flex items-center justify-center z-20">
            {currentCard > 0 && (
              <button
                onClick={prevCard}
                aria-label="Previous Card"
                className="absolute left-1.5 sm:-left-5 top-1/2 -translate-y-1/2 z-40 w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-[#07261F]/95 hover:bg-[#E5C158] text-[#E5C158] hover:text-[#041612] border-2 border-[#E5C158] flex items-center justify-center shadow-2xl transition active:scale-90"
              >
                <ChevronLeftIcon className="w-5 h-5" />
              </button>
            )}

            {currentCard < CHAPTERS.length - 1 && (
              <button
                onClick={nextCard}
                aria-label="Next Card"
                className="absolute right-1.5 sm:-right-5 top-1/2 -translate-y-1/2 z-40 h-9 px-2.5 sm:w-11 sm:h-11 sm:px-0 rounded-full bg-gradient-to-r from-[#B38728] via-[#FBF5B7] to-[#B38728] text-[#041612] border-2 border-[#FFFBEB] flex items-center justify-center gap-0.5 shadow-2xl transition active:scale-90"
              >
                <span className="text-[9px] font-black uppercase tracking-wider sm:hidden">Next</span>
                <ChevronRightIcon className="w-4 h-4 sm:w-5 sm:h-5" />
              </button>
            )}

            <main
              onTouchStart={(e) => {
                touchStartX.current = e.touches[0].clientX;
                touchStartY.current = e.touches[0].clientY;
              }}
              onTouchEnd={(e) => {
                if (touchStartX.current === null || touchStartY.current === null) return;
                const dx = e.changedTouches[0].clientX - touchStartX.current;
                const dy = e.changedTouches[0].clientY - touchStartY.current;
                if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
                  if (dx < 0) nextCard();
                  if (dx > 0) prevCard();
                }
                touchStartX.current = null;
                touchStartY.current = null;
              }}
              className="relative w-full h-[80vh] min-h-[580px] max-h-[750px] rounded-[30px] bg-gradient-to-b from-[#082B22] via-[#051C16] to-[#03110D] border-2 border-[#E5C158] shadow-[0_25px_70px_rgba(0,0,0,0.85)] overflow-hidden flex flex-col"
            >
              {/* Corner Royal Jaali Filigree Accents */}
              <div className="pointer-events-none absolute top-2.5 left-2.5 w-8 h-8 border-t-2 border-l-2 border-[#E5C158]/60 rounded-tl-xl z-20" />
              <div className="pointer-events-none absolute top-2.5 right-2.5 w-8 h-8 border-t-2 border-r-2 border-[#E5C158]/60 rounded-tr-xl z-20" />
              <div className="pointer-events-none absolute bottom-2.5 left-2.5 w-8 h-8 border-b-2 border-l-2 border-[#E5C158]/60 rounded-bl-xl z-20" />
              <div className="pointer-events-none absolute bottom-2.5 right-2.5 w-8 h-8 border-b-2 border-r-2 border-[#E5C158]/60 rounded-br-xl z-20" />

              <RoyalAtmosphere bursts={bursts} />

              <div key={currentCard} className="stage-transition w-full h-full">
                {currentCard === 0 && (
                  <Card01EnvelopeSeal
                    config={WEDDING_CONFIG}
                    onTriggerBurst={triggerPetalBurst}
                    onUnsealComplete={() => {
                      setIsPlayingMusic(true);
                      goToCard(1);
                    }}
                  />
                )}

                {currentCard === 1 && (
                  <Card02Couple
                    config={WEDDING_CONFIG}
                    blessingsCount={blessingsCount}
                    onAddBlessing={() => setBlessingsCount((c) => c + 1)}
                    onTriggerBurst={triggerPetalBurst}
                    onOpenLightbox={(photo) =>
                      setLightbox({ isOpen: true, items: [photo], currentIndex: 0 })
                    }
                  />
                )}

                {currentCard === 2 && (
                  <Card03PolaroidGallery
                    config={WEDDING_CONFIG}
                    onSelectPhotoIndex={(idx) =>
                      setLightbox({ isOpen: true, items: WEDDING_CONFIG.gallery, currentIndex: idx })
                    }
                  />
                )}

                {currentCard === 3 && (
                  <Card04ScratchSaveTheDate
                    config={WEDDING_CONFIG}
                    onTriggerBurst={triggerPetalBurst}
                  />
                )}

                {currentCard === 4 && (
                  <Card05RoyalItinerary
                    config={WEDDING_CONFIG}
                    activeEventIndex={eventStep}
                    onSelectEventIndex={(idx) => setEventStep(idx)}
                  />
                )}

                {currentCard === 5 && (
                  <Card06VenueAndClosing
                    config={WEDDING_CONFIG}
                    onRestart={() => goToCard(0)}
                  />
                )}
              </div>
            </main>
          </div>

          {/* Bottom Interactive Chapter Dock */}
          <nav
            aria-label="Invitation Chapters"
            className="relative z-30 w-full max-w-[440px] mt-2.5 px-2 py-1.5 rounded-full bg-[#07261F]/95 border border-[#E5C158]/55 shadow-xl flex items-center justify-between gap-1 overflow-x-auto no-scrollbar"
          >
            {CHAPTERS.map((chap) => {
              const active = chap.index === currentCard;
              return (
                <button
                  key={chap.code}
                  onClick={() => goToCard(chap.index)}
                  className={`flex-1 py-1.5 px-2 rounded-full text-[10px] font-bold tracking-wider uppercase transition-all whitespace-nowrap ${
                    active
                      ? 'bg-gradient-to-r from-[#B38728] via-[#FBF5B7] to-[#B38728] text-[#041612] shadow'
                      : 'text-[#D1FAE5]/70 hover:text-white'
                  }`}
                >
                  <span className="hidden sm:inline">{chap.code} • </span>
                  <span>{chap.name}</span>
                </button>
              );
            })}
          </nav>

          {/* Fullscreen Lightbox */}
          <LightboxModal
            isOpen={lightbox.isOpen}
            items={lightbox.items}
            currentIndex={lightbox.currentIndex}
            onClose={() => setLightbox((s) => ({ ...s, isOpen: false }))}
            onPrev={() =>
              setLightbox((s) => ({
                ...s,
                currentIndex: (s.currentIndex - 1 + s.items.length) % s.items.length
              }))
            }
            onNext={() =>
              setLightbox((s) => ({
                ...s,
                currentIndex: (s.currentIndex + 1) % s.items.length
              }))
            }
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
